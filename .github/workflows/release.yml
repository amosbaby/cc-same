name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Builds only read the repository; the release job alone may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot appear in `if:`; this tells the steps whether Apple signing is set up.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libfontconfig-dev libssl-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      # No build cache in release builds: a cache written by another workflow must not reach
      # signed binaries. Build before the signing identity is imported, so no build script or
      # proc macro runs while it is available.
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p cc-same
          cargo build --release --locked --manifest-path crates/app/Cargo.toml
      # With the Apple secrets set, macOS builds are signed with a Developer ID, notarized and
      # stapled; without them (forks), they are ad-hoc signed.
      - name: Import the signing identity (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for value in APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_SIGNING_IDENTITY; do
            [[ -n "${!value}" ]] || { echo "::error::Missing release input: $value"; exit 1; }
          done
          certificate="$RUNNER_TEMP/signing.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          {
            echo "CODESIGN_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "NOTARIZE=1"
            echo "APPLE_API_KEY=$api_key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/bundle-linux.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          cargo build --release --locked -p cc-same
          cargo build --release --locked --manifest-path crates/app/Cargo.toml
          New-Item -ItemType Directory -Force dist/app, dist/cli | Out-Null
          Copy-Item target/release/cc-same-app.exe "dist/app/CC Same.exe"
          Copy-Item target/release/cc-same.exe, target/release/cc-same-agent.exe dist/cli/
          Compress-Archive -Path "dist/app/*" -DestinationPath "dist/CC-Same-$version-windows-x64.zip"
          Compress-Archive -Path "dist/cli/*" -DestinationPath "dist/cc-same-cli-$version-windows-x64.zip"
          Remove-Item -Recurse dist/app, dist/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # The release notes are the version's section of CHANGELOG.md; the app shows them too.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1 == "##" && f { exit } $1 == "##" && $2 == v { f = 1; next } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
