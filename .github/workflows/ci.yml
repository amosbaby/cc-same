name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core + CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            crates/app -> ../../target
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: The app and the CLI have the same version, and the changelog covers it
        if: runner.os == 'Linux'
        run: |
          v() { sed -n 's/^version = "\(.*\)"/\1/p' "$1" | head -1; }
          test "$(v Cargo.toml)" = "$(v crates/app/Cargo.toml)"
          grep -q "^## $(v Cargo.toml) " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $(v Cargo.toml)"; exit 1; }

  msrv:
    name: CLI on Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - run: cargo +1.85 build --locked -p cc-same

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libfontconfig-dev libssl-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            crates/app -> ../../target
      - run: cargo fmt --manifest-path crates/app/Cargo.toml --all --check
      - run: cargo app-clippy -- -D warnings
      - run: cargo app-test
      - run: cargo app-build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo audit -f crates/app/Cargo.lock
